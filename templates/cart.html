{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'css/cart.css' %}">

</head>
<body>

<div class="container my-5">
    <div class="row g-4">

        <!-- CART ITEMS -->
        <div class="col-lg-8">
            <div class="cart-card p-4">
                <h4 class="cart-title mb-4">🛒 Your Shopping Cart</h4>

                <div class="cart-items-scroll">
                    <table class="table align-middle text-center" id="cart-table" style="display:none;">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th class="text-start">Perfume</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Subtotal</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="cart-items"></tbody>
                    </table>
                </div>

                <div id="empty-message" class="empty-cart">
                    Loading cart...
                </div>
            </div>
        </div>

        <!-- TOTAL -->
        <div class="col-lg-4">
            <div class="total-box">
                <h5 class="mb-3">Order Summary</h5>

                <div class="d-flex justify-content-between mb-2">
                    <span>Total</span>
                    <strong><span id="total-price">0</span> GEL</strong>
                </div>

                <hr>

                <a href="api/checkout/" class="btn btn-success w-100 mb-2">
                    Proceed to Checkout
                </a>

                <a href="/" class="btn btn-outline-secondary w-100">
                    Continue Shopping
                </a>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/cart.js' %}" defer></script>
</body>
</html>
