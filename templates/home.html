<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Perfume Store</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: "Poppins", sans-serif; background: #fafafa; }
        .hero {
            height: 80vh;
            border-radius: 15px;
            display: flex;
            align-items: center;
            padding-left: 50px;
            margin-bottom: 60px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .hero h1 { color: rgb(112, 20, 20); font-size: 60px; font-weight: 700; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .hero p { color: #463939; font-size: 20px; max-width: 450px; }
        .welcome-message { font-size: 20px; font-weight: 500; margin-top: 10px; color: #222; }
        .cart-count { position: relative; display: inline-block; }
        .cart-count span { position: absolute; top: -10px; right: -10px; background: red; color: white; font-size: 12px; padding: 2px 6px; border-radius: 50%; }
        .product-card { background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); transition: 0.3s; overflow: hidden; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .product-card img { height: 260px; object-fit: contain; padding: 20px; }
        .product-card .price { color: #6a4fb6; font-weight: bold; font-size: 18px; }
        .brand-card { background: white; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.08); transition: 0.3s ease; height: 100%; }
        .brand-card img { height: 120px; object-fit: contain; margin-bottom: 15px; }
        .brand-card:hover { transform: translateY(-8px); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.438); }
        .brand-card h4 { font-weight: 600; margin-top: 10px; }
        .section-title { font-size: 32px; font-weight: 700; }
        .pagination-buttons { margin-top: 20px; text-align: center; }
        .pagination-buttons button { margin: 0 5px; }
        .filters { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .perfume-detail-image { max-height: 400px; object-fit: contain; width: 100%; }
        .perfume-detail-price { color: #6a4fb6; font-weight: bold; font-size: 24px; }
        .perfume-detail-brand { color: #666; font-size: 18px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container mt-4">

    <!-- HERO SECTION -->
    <div class="hero">
        <div>
            <h1>Luxury Perfumes</h1>
            <p>Discover premium fragrances crafted for elegance, confidence, and unforgettable presence.</p>
            <div class="welcome-message" id="welcomeMessage">Welcome, Guest!</div>
            <button class="btn btn-light btn-lg rounded-pill px-4 py-2 mt-2">Shop Now</button>

            <!-- Registration/Login/Logout Buttons -->
            <button class="btn btn-primary btn-lg rounded-pill px-4 py-2 ms-3 mt-2" id="registerBtn" data-bs-toggle="modal" data-bs-target="#registerModal">Register</button>
            <button class="btn btn-secondary btn-lg rounded-pill px-4 py-2 ms-2 mt-2" id="loginBtn" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
            <button class="btn btn-danger btn-lg rounded-pill px-4 py-2 ms-2 mt-2 d-none" id="logoutBtn" onclick="logoutUser()">Logout</button>
            <button class="btn btn-info btn-lg px-4 py-2 ms-2 mt-2" onclick="debugWhoAmI()">WhoAmI</button>

            <!-- CART BUTTON -->
             <button class="btn btn-info btn-lg px-4 py-2 ms-2 mt-2" onclick="window.location.href='/cart-page/'">Cart</button><span id="cartCount">0</span>

            <!-- ORDER HISTORY BUTTON -->
            <button class="btn btn-warning btn-lg px-4 py-2 ms-2 mt-2" id="ordersBtn" onclick="window.location.href='/orders/'">
                My Orders
            </button>


        </div>
    </div>

    <!-- FILTERS -->
    <div class="filters">
        <input type="text" id="search-name" class="form-control" placeholder="Search by name" style="max-width: 250px;">
        <button class="btn btn-outline-primary" onclick="filterPerfumes('')">All</button>
        <button class="btn btn-outline-primary" onclick="filterPerfumes('M')">Men</button>
        <button class="btn btn-outline-primary" onclick="filterPerfumes('W')">Women</button>
        <button class="btn btn-outline-primary" onclick="filterPerfumes('U')">Unisex</button>
        <button class="btn btn-primary" onclick="searchPerfumes()">Search</button>
    </div>

    <!-- DYNAMIC PERFUMES -->
    <h2 class="section-title mb-4">Featured Perfumes</h2>
    <div class="row g-4" id="perfumes-container"></div>
    <div class="pagination-buttons" id="perfume-pagination"></div>

    <!-- DYNAMIC BRANDS -->
    <h2 class="section-title mt-5 mb-4">Shop by Brand</h2>
    <div class="row g-4" id="brands-container"></div>

</div>

<!-- REGISTER MODAL -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Register</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="text" id="regUsername" class="form-control mb-2" placeholder="Username">
        <input type="text" id="regFirstName" class="form-control mb-2" placeholder="First Name">
        <input type="text" id="regLastName" class="form-control mb-2" placeholder="Last Name">
        <input type="email" id="regEmail" class="form-control mb-2" placeholder="Email">
        <input type="password" id="regPassword" class="form-control mb-2" placeholder="Password">
        <input type="password" id="regPassword2" class="form-control mb-2" placeholder="Confirm Password">
        <button type="button" class="btn btn-primary w-100" onclick="registerUser()">Register</button>
      </div>
    </div>
  </div>
</div>

<!-- LOGIN MODAL -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Login</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="text" id="loginUsername" class="form-control mb-2" placeholder="Username">
        <input type="password" id="loginPassword" class="form-control mb-2" placeholder="Password">
        <button type="button" class="btn btn-secondary w-100" onclick="loginUser()">Login</button>
      </div>
    </div>
  </div>
</div>

<!-- PERFUME DETAIL MODAL -->
<div class="modal fade" id="perfumeDetailModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="perfumeDetailTitle">Perfume Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-md-6 text-center">
            <img id="perfumeDetailImage" src="" alt="Perfume" class="perfume-detail-image mb-3">
          </div>
          <div class="col-md-6">
            <h3 id="perfumeDetailName"></h3>
            <p class="perfume-detail-brand" id="perfumeDetailBrand"></p>
            <p class="perfume-detail-price" id="perfumeDetailPrice"></p>
            <p><strong>Type:</strong> <span id="perfumeDetailType"></span></p>
            <p><strong>Description:</strong></p>
            <p id="perfumeDetailDescription" class="text-muted"></p>
            <button class="btn btn-dark btn-lg w-100 mt-3" id="perfumeDetailAddCart">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
const csrftoken = document.querySelector('meta[name="csrf-token"]').content;

// Helper to get auth headers
function getAuthHeaders() {
    const token = localStorage.getItem('access_token');
    const headers = {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrftoken
    };
    if (token) {
        headers['Authorization'] = 'Bearer ' + token;
    }
    return headers;
}

// ------------------ CART LOGIC ------------------
async function updateCartCount() {
    try {
        const res = await fetch('/api/cart/', {
            method: 'GET',
            headers: getAuthHeaders()
        });
        if(res.ok){
            const data = await res.json();
            document.getElementById('cartCount').textContent = data.total_items || 0;
        }
    } catch (err) { 
        console.error('Cart count error:', err);
        document.getElementById('cartCount').textContent = '0';
    }
}

async function addToCart(perfumeId) {
    try {
        const res = await fetch(`/api/cart/add/${perfumeId}/`, {
            method: 'POST',
            headers: getAuthHeaders()
        });
        if(res.ok){
            const data = await res.json();
            document.getElementById('cartCount').textContent = data.total_items || 0;
            alert('Added to cart!');
        } else {
            const data = await res.json();
            alert('Failed to add: ' + JSON.stringify(data));
        }
    } catch(err){
        console.error('Add to cart error:', err);
        alert('Error adding to cart.');
    }
}


function openCart() {
    window.location.href = '/api/cart/';
}

// ------------------ PERFUME DETAIL MODAL ------------------
function viewPerfume(perfume) {
    document.getElementById('perfumeDetailTitle').textContent = perfume.name;
    document.getElementById('perfumeDetailName').textContent = perfume.name;
    document.getElementById('perfumeDetailBrand').textContent = perfume.brand.name;
    document.getElementById('perfumeDetailPrice').textContent = `$${perfume.price}`;
    document.getElementById('perfumeDetailType').textContent = perfume.perfume_type_display;
    document.getElementById('perfumeDetailDescription').textContent = perfume.description || 'No description available.';
    document.getElementById('perfumeDetailImage').src = perfume.image || 'https://via.placeholder.com/400x400';
    document.getElementById('perfumeDetailImage').alt = perfume.name;

    const addCartBtn = document.getElementById('perfumeDetailAddCart');

    if (perfume.in_stock) {
        addCartBtn.disabled = false;
        addCartBtn.textContent = "Add to Cart";
        addCartBtn.onclick = function() {
            addToCart(perfume.id);
        };
    } else {
        addCartBtn.disabled = true;
        addCartBtn.textContent = "Out of Stock";
        addCartBtn.onclick = null; // disable click
    }

    const modal = new bootstrap.Modal(document.getElementById('perfumeDetailModal'));
    modal.show();
}


// ------------------ USER LOGIC ------------------
async function updateWelcomeMessage() {
    const token = localStorage.getItem('access_token');
    const welcomeEl = document.getElementById('welcomeMessage');
    const registerBtn = document.getElementById('registerBtn');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const ordersBtn = document.getElementById('ordersBtn'); // My Orders button

    if (!token) {
        // Guest user view
        welcomeEl.textContent = "Welcome, Guest!";
        registerBtn.classList.remove('d-none');
        loginBtn.classList.remove('d-none');
        logoutBtn.classList.add('d-none');
        if (ordersBtn) ordersBtn.classList.add('d-none'); // hide orders for guests
        // Update cart for guest user
        updateCartCount();
        return;
    }

    try {
        // Fetch authenticated user info
        const res = await fetch('/api/whoami/', {
            headers: { "Authorization": "Bearer " + token }
        });

        if (!res.ok) {
            // Token invalid or expired
            localStorage.removeItem('access_token');
            welcomeEl.textContent = "Welcome, Guest!";
            registerBtn.classList.remove('d-none');
            loginBtn.classList.remove('d-none');
            logoutBtn.classList.add('d-none');
            if (ordersBtn) ordersBtn.classList.add('d-none'); // hide orders for guests
            updateCartCount();
            return;
        }

        const user = await res.json();
        // Authenticated user view
        welcomeEl.textContent = `Welcome, ${user.username}!`;
        registerBtn.classList.add('d-none');
        loginBtn.classList.add('d-none');
        logoutBtn.classList.remove('d-none');
        if (ordersBtn) ordersBtn.classList.remove('d-none'); // show orders button
        // Update cart for authenticated user
        updateCartCount();

    } catch (error) {
        console.error("WHOAMI error:", error);
        // fallback to guest view
        welcomeEl.textContent = "Welcome, Guest!";
        registerBtn.classList.remove('d-none');
        loginBtn.classList.remove('d-none');
        logoutBtn.classList.add('d-none');
        if (ordersBtn) ordersBtn.classList.add('d-none');
        updateCartCount();
    }
}


function logoutUser() {
    localStorage.removeItem('access_token');
    // Clear guest cart by removing guest_id cookie
    document.cookie = 'guest_id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    updateWelcomeMessage();
    alert('Logged out successfully!');
    location.reload(); // Reload to start fresh guest session
}

// ------------------ REGISTER ------------------
async function registerUser() {
    const data = {
        username: document.getElementById('regUsername').value,
        first_name: document.getElementById('regFirstName').value,
        last_name: document.getElementById('regLastName').value,
        email: document.getElementById('regEmail').value,
        password: document.getElementById('regPassword').value,
        password2: document.getElementById('regPassword2').value
    };

    const res = await fetch('/api/register/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
        body: JSON.stringify(data)
    });

    const result = await res.json();
    if(res.ok){ 
        localStorage.setItem('access_token', result.user.access || result.tokens?.access);
        // Clear guest cart cookie
        document.cookie = 'guest_id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        updateWelcomeMessage();
        alert('Registered successfully!');
        bootstrap.Modal.getInstance(document.getElementById('registerModal')).hide();
        location.reload(); // Reload to fetch user's cart
    } else { 
        alert(JSON.stringify(result)); 
    }
}

// ------------------ LOGIN ------------------
async function loginUser() {
    const data = {
        username: document.getElementById('loginUsername').value,
        password: document.getElementById('loginPassword').value
    };

    const res = await fetch('/api/login/', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'X-CSRFToken': csrftoken },
        body: JSON.stringify(data)
    });

    const result = await res.json();
    if(res.ok){ 
        localStorage.setItem('access_token', result.access || result.tokens?.access);
        // Clear guest cart cookie
        document.cookie = 'guest_id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        updateWelcomeMessage();
        alert('Logged in successfully!');
        bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
        location.reload(); // Reload to fetch user's cart
    } else { 
        alert(JSON.stringify(result)); 
    }
}

// ------------------ WHOAMI DEBUG ------------------
async function debugWhoAmI() {
    const token = localStorage.getItem('access_token');
    if(!token){ alert('No token found!'); return; }

    const res = await fetch('/api/whoami/', {
        headers: { "Authorization": "Bearer " + token }
    });
    const data = await res.json();
    console.log("WHOAMI RESULT:", data);
    alert(JSON.stringify(data, null, 2));
}

// ------------------ PERFUMES & BRANDS ------------------
let currentType = '';
let currentSearch = '';
let currentBrand = '';

async function loadPerfumes(url = '/api/perfumes/') {
    try {
        const params = new URL(url, window.location.origin);
        if (currentType) params.searchParams.set('perfume_type', currentType);
        if (currentSearch) params.searchParams.set('search', currentSearch);
        if (currentBrand) params.searchParams.set('brand', currentBrand);

        const response = await fetch(params.toString());
        const data = await response.json();
        const perfumes = data.results;
        const container = document.getElementById('perfumes-container');
        container.innerHTML = '';
        perfumes.forEach(perfume => {
    container.innerHTML += `
    <div class="col-md-3 col-sm-6">
        <div class="product-card text-center">
            <img src="${perfume.image ? perfume.image : 'https://via.placeholder.com/260x260'}" alt="${perfume.name}">
            <h5 class="mt-2">${perfume.name}</h5>
            <p class="text-muted">${perfume.brand.name}</p>
            <p class="price">$${perfume.price}</p>
            <p>Type: ${perfume.perfume_type_display}</p>
            
            <button class="btn btn-outline-dark btn-sm mb-3" onclick='viewPerfume(${JSON.stringify(perfume).replace(/'/g, "&#39;")})'>View</button>
            <button class="btn btn-dark btn-sm mb-3" 
                onclick="addToCart(${perfume.id}); return false;" 
                ${!perfume.in_stock ? 'disabled' : ''}>
                ${!perfume.in_stock ? 'Out of Stock' : 'Add to Cart'}
            </button>
        </div>
    </div>`;
});


        const pagination = document.getElementById('perfume-pagination');
        pagination.innerHTML = '';
        if (data.previous) {
            let prevURL = new URL(data.previous).pathname + new URL(data.previous).search;
            pagination.innerHTML += `<button class="btn btn-outline-primary" onclick="loadPerfumes('${prevURL}')">Previous</button>`;
        }
        if (data.next) {
            let nextURL = new URL(data.next).pathname + new URL(data.next).search;
            pagination.innerHTML += `<button class="btn btn-outline-primary" onclick="loadPerfumes('${nextURL}')">Next</button>`;
        }

    } catch (error) {
        console.error('Error loading perfumes:', error);
    }
}

async function loadBrands() {
    try {
        const response = await fetch('/api/brands/');
        const brands = await response.json();
        const container = document.getElementById('brands-container');
        container.innerHTML = '';
        brands.forEach(brand => {
            container.innerHTML += `
            <div class="col-md-4 col-sm-6">
                <div class="brand-card">
                    <img src="${brand.image ? brand.image : 'https://via.placeholder.com/120x120'}" alt="${brand.name}">
                    <h4>${brand.name}</h4>
                    <button class="btn btn-dark btn-sm mt-3" onclick="filterByBrand(${brand.id})">View Brand</button>
                </div>
            </div>`;
        });
    } catch (error) {
        console.error('Error loading brands:', error);
    }
}

function filterPerfumes(type) { currentType = type; currentSearch = ''; currentBrand = ''; document.getElementById('search-name').value=''; loadPerfumes(); }
function searchPerfumes() { currentSearch=document.getElementById('search-name').value.trim(); currentType=''; currentBrand=''; loadPerfumes(); }
function filterByBrand(brandId) { currentBrand=brandId; currentType=''; currentSearch=''; document.getElementById('search-name').value=''; loadPerfumes(); }

// ------------------ INITIAL LOAD ------------------
updateWelcomeMessage();
loadPerfumes();
loadBrands();
</script>
</body>
</html>
