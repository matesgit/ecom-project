<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f8;
        }

        .page-title {
            font-weight: 600;
            margin-bottom: 25px;
        }

        .card-box {
            background: #fff;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.05);
        }

        .table thead th {
            background: #f8f9fb;
            font-weight: 500;
            border-bottom: none;
        }

        .product-name {
            font-weight: 500;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .summary-total {
            font-size: 18px;
            font-weight: 600;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-success {
            border-radius: 10px;
            padding: 12px;
            font-weight: 500;
        }

        .back-link {
            text-decoration: none;
            color: #6c757d;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .sticky-summary {
            position: sticky;
            top: 30px;
        }
        .items-scroll-box {
    max-height: 360px; /* shows ~4 items */
    overflow-y: auto;
    padding-right: 5px;
}

/* Optional: nicer scrollbar */
.items-scroll-box::-webkit-scrollbar {
    width: 6px;
}

.items-scroll-box::-webkit-scrollbar-thumb {
    background-color: #ccc;
    border-radius: 10px;
}

.items-scroll-box::-webkit-scrollbar-thumb:hover {
    background-color: #aaa;
}

    </style>
</head>
<body>

<div class="container my-5">

    <h3 class="page-title">Checkout</h3>

    <div class="row g-4">

        <!-- ORDER ITEMS -->
        <div class="col-lg-8">
            <div class="card-box mb-4">
                <h5 class="mb-3">Order Summary</h5>

                <div class="items-scroll-box">
    <div id="order-items">
        <!-- JS renders table here -->
    </div>
</div>

            </div>
        </div>

        <!-- BILLING + TOTAL -->
        <div class="col-lg-4">
            <div class="card-box sticky-summary">

                <h5 class="mb-3">Billing Details</h5>

                <form id="order-form">

                    <input type="text"
                           class="form-control mb-3"
                           id="full_name"
                           placeholder="Full Name"
                           required>

                    <input type="email"
                           class="form-control mb-3"
                           id="email"
                           placeholder="Email"
                           required>

                    <input type="text"
                           class="form-control mb-3"
                           id="phone"
                           placeholder="Phone Number"
                           required>

                    <textarea class="form-control mb-3"
                              id="address"
                              rows="3"
                              placeholder="Delivery Address"
                              required></textarea>

                    <hr>

                    <div class="summary-row">
                        <span>Total</span>
                        <span class="summary-total">
                            <span id="order-total">0</span> GEL
                        </span>
                    </div>

                    <button type="submit" class="btn btn-success w-100 mt-3">
                        Place Order
                    </button>
                    

                </form>
                <a href="{% url 'cart_page' %}" class="btn btn-success w-100 mt-3">
                    Back to Cart
                </a>



                <div class="text-center mt-3">
                    <a href="/" class="back-link">← Back to Home</a>
                </div>

            </div>
        </div>

    </div>
</div>

<script>
// Auth headers
function getAuthHeaders() {
    const token = localStorage.getItem("access_token");
    const headers = { "Content-Type": "application/json" };
    if (token) headers["Authorization"] = "Bearer " + token;
    return headers;
}

// LOAD CHECKOUT DATA
async function loadCheckout() {
    const res = await fetch("/api/checkout/", {
        method: "GET",
        headers: getAuthHeaders()
    });

    const data = await res.json();

    if (data.error) {
        document.getElementById("order-items").innerHTML = `<p>${data.error}</p>`;
        return;
    }

    let html = `
        <table class="table align-middle text-center">
            <thead>
                <tr>
                    <th class="text-start">Product</th>
                    <th>Image</th>
                    <th>Qty</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody>
    `;

    data.items.forEach(i => {
        html += `
            <tr>
                <td class="text-start product-name">${i.perfume.name}</td>
                <td>
                    <img src="${i.perfume.image}" width="70" class="rounded">
                </td>
                <td>${i.quantity}</td>
                <td><strong>${i.subtotal} GEL</strong></td>
            </tr>
        `;
    });

    html += "</tbody></table>";

    document.getElementById("order-items").innerHTML = html;
    document.getElementById("order-total").textContent = data.total;

    document.getElementById("full_name").value = data.user.full_name || "";
    document.getElementById("email").value = data.user.email || "";
}

// PLACE ORDER
document.getElementById("order-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const payload = {
        full_name: document.getElementById("full_name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        address: document.getElementById("address").value,
    };

    const res = await fetch("/api/order/place/", {
        method: "POST",
        headers: getAuthHeaders(),
        body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (res.ok) {
        alert("Order placed successfully! Order ID: " + data.order_id);
        window.location.href = "/";
    } else {
        alert(data.error || "Failed to place order");
    }
});

// INITIAL LOAD
loadCheckout();
</script>

</body>
</html>
