{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'css/checkout.css' %}">

</head>
<body>

<div class="container my-5">

    <h3 class="page-title">Checkout</h3>

    <div class="row g-4">

        <!-- ORDER ITEMS -->
        <div class="col-lg-8">
            <div class="card-box mb-4">
                <h5 class="mb-3">Order Summary</h5>

                <div class="items-scroll-box">
    <div id="order-items">
        <!-- JS renders table here -->
    </div>
</div>

            </div>
        </div>

        <!-- BILLING + TOTAL -->
        <div class="col-lg-4">
            <div class="card-box sticky-summary">

                <h5 class="mb-3">Billing Details</h5>

                <form id="order-form">

                    <input type="text"
                           class="form-control mb-3"
                           id="full_name"
                           placeholder="Full Name"
                           required>

                    <input type="email"
                           class="form-control mb-3"
                           id="email"
                           placeholder="Email"
                           required>

                    <input type="text"
                           class="form-control mb-3"
                           id="phone"
                           placeholder="Phone Number"
                           required>

                    <textarea class="form-control mb-3"
                              id="address"
                              rows="3"
                              placeholder="Delivery Address"
                              required></textarea>

                    <hr>

                    <div class="summary-row">
                        <span>Total</span>
                        <span class="summary-total">
                            <span id="order-total">0</span> GEL
                        </span>
                    </div>

                    <button type="submit" class="btn btn-success w-100 mt-3">
                        Place Order
                    </button>
                    

                </form>
                <a href="{% url 'cart_page' %}" class="btn btn-success w-100 mt-3">
                    Back to Cart
                </a>



                <div class="text-center mt-3">
                    <a href="/" class="back-link">← Back to Home</a>
                </div>

            </div>
        </div>

    </div>
</div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Your Checkout JS -->
<script src="{% static 'js/checkout.js' %}" defer></script>

</body>
</html>
